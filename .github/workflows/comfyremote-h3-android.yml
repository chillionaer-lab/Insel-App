name: Build ComfyRemote H3 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ComfyRemoteH3/**'
      - '.github/workflows/comfyremote-h3-android.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ComfyRemoteH3
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComfyRemote-H3-Android-debug
          path: ComfyRemoteH3/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
