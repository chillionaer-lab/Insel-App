name: ComfyRemote H3 APK
on:
  workflow_dispatch:
  push:
    branches: [comfyremote-h3-build]
    paths: ['comfyremote-h3/**', '.github/workflows/comfyremote-h3-apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comfyremote-h3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ComfyRemote-H3-Online-APK
          path: comfyremote-h3/app/build/outputs/apk/debug/app-debug.apk