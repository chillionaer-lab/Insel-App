name: ComfyRemote H3 APK
on:
  workflow_dispatch:
  push:
    branches: [comfyremote-h3-build]
    paths:
      - 'comfyremote-h3/**'
      - '.github/workflows/comfyremote-h3-apk.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: comfyremote-h3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          fi
          test -x "$SDKMANAGER" || { echo "No Android SDK manager on runner"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ComfyRemote-H3-Online-APK
          path: comfyremote-h3/app/build/outputs/apk/debug/app-debug.apk
